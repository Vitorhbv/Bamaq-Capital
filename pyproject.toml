[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bamaq-capital"
version = "0.1.0"
description = "Processamento financeiro assíncrono com outbox e trabalhos duráveis"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "SQLAlchemy==2.0.41",
  "alembic==1.16.1",
  "PyMySQL[rsa]==1.1.1",
  "confluent-kafka==2.10.0",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.12"]

[project.scripts]
bamaq = "bamaq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a dedicated MySQL database",
  "kafka: requires Kafka and MySQL",
]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
